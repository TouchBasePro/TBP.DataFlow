name: Watch Kestra upstream releases

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Open a rebase issue for a newer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_version=$(sed -n 's/^FROM kestra\/kestra:\([0-9.]*\)$/\1/p' Dockerfile.tbp)
          latest_tag=$(gh api repos/kestra-io/kestra/releases/latest --jq '.tag_name')
          latest_version=${latest_tag#v}

          if [ "$latest_version" = "$base_version" ]; then
            exit 0
          fi

          title="chore: rebase TBP Kestra branding onto $latest_tag"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body "Upstream Kestra released $latest_tag. Rebase branch \`tbp-branding\`, update \`Dockerfile.tbp\`, run the UI build, and publish a new immutable TBP image."
          fi